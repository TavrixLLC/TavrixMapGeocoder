openapi: 3.0.3
info:
  title: TavrixMap Pelias Read-Only Geocoder API
  version: 1.0.0
  description: |
    Swagger documentation for the Docker-based Pelias geocoder stack.

    The Pelias API reads from Elasticsearch only. PostGIS is never queried by
    the API at request time. The sync worker periodically reads selected rows
    from the existing PostGIS database using read-only SELECT queries and
    indexes Pelias-compatible documents into Elasticsearch.

    Data refresh flow:

    1. The external OSM pipeline updates PostGIS.
    2. The worker runs each enabled source on its cron schedule.
    3. The worker opens read-only PostgreSQL sessions and executes configured SELECT queries.
    4. Rows are transformed into Pelias-compatible documents.
    5. Documents are bulk indexed into Elasticsearch using deterministic IDs.
    6. Pelias API serves user requests from Elasticsearch only.
    7. Deletes are handled by source-scoped ID diffing or by blue/green reindex.
servers:
  - url: http://localhost:4000
    description: Pelias API
tags:
  - name: Geocoding
    description: Public Pelias search endpoints backed by Elasticsearch.
  - name: Batch
    description: Batch geocoding endpoints.
  - name: Discovery
    description: Nearby, categories, and index discovery endpoints.
  - name: Debug
    description: Internal debug and explain endpoints.
  - name: Worker
    description: Read-only sync worker health and metrics.
paths:
  /v1/search:
    get:
      tags:
        - Geocoding
      summary: Search for places, venues, streets, and admin features
      description: Full text geocoding search against the Pelias Elasticsearch index.
      parameters:
        - $ref: '#/components/parameters/Text'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Layers'
        - $ref: '#/components/parameters/Sources'
        - $ref: '#/components/parameters/BoundaryCountry'
        - $ref: '#/components/parameters/FocusPointLat'
        - $ref: '#/components/parameters/FocusPointLon'
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/FallbackLang'
        - $ref: '#/components/parameters/BoundaryRectMinLon'
        - $ref: '#/components/parameters/BoundaryRectMinLat'
        - $ref: '#/components/parameters/BoundaryRectMaxLon'
        - $ref: '#/components/parameters/BoundaryRectMaxLat'
        - $ref: '#/components/parameters/BoundaryCircleLat'
        - $ref: '#/components/parameters/BoundaryCircleLon'
        - $ref: '#/components/parameters/BoundaryCircleRadius'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/ResponseMode'
        - $ref: '#/components/parameters/Dedupe'
      responses:
        '200':
          description: GeoJSON FeatureCollection of search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
              examples:
                restaurant:
                  summary: Restaurant search
                  value:
                    geocoding:
                      version: '0.2'
                      query:
                        text: restaurant
                        size: 10
                    type: FeatureCollection
                    features:
                      - type: Feature
                        geometry:
                          type: Point
                          coordinates: [44.488553, 31.9057713]
                        properties:
                          id: '13189798864'
                          gid: osm_postgis:venue:13189798864
                          layer: venue
                          source: osm_postgis
                          source_id: '13189798864'
                          name: Hospitality Restaurant
                          label: Hospitality Restaurant
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/autocomplete:
    get:
      tags:
        - Geocoding
      summary: Autocomplete a partial place query
      description: Returns candidate features for type-ahead search.
      parameters:
        - $ref: '#/components/parameters/Text'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Layers'
        - $ref: '#/components/parameters/Sources'
        - $ref: '#/components/parameters/FocusPointLat'
        - $ref: '#/components/parameters/FocusPointLon'
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/FallbackLang'
        - $ref: '#/components/parameters/BoundaryRectMinLon'
        - $ref: '#/components/parameters/BoundaryRectMinLat'
        - $ref: '#/components/parameters/BoundaryRectMaxLon'
        - $ref: '#/components/parameters/BoundaryRectMaxLat'
        - $ref: '#/components/parameters/BoundaryCircleLat'
        - $ref: '#/components/parameters/BoundaryCircleLon'
        - $ref: '#/components/parameters/BoundaryCircleRadius'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/ResponseMode'
        - $ref: '#/components/parameters/Dedupe'
      responses:
        '200':
          description: GeoJSON FeatureCollection of autocomplete results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/suggest:
    get:
      tags:
        - Geocoding
      summary: Suggest/autocomplete a partial place query
      description: Alias to /v1/autocomplete. Returns candidate features for type-ahead search.
      parameters:
        - $ref: '#/components/parameters/Text'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Layers'
        - $ref: '#/components/parameters/Sources'
        - $ref: '#/components/parameters/FocusPointLat'
        - $ref: '#/components/parameters/FocusPointLon'
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/FallbackLang'
        - $ref: '#/components/parameters/BoundaryRectMinLon'
        - $ref: '#/components/parameters/BoundaryRectMinLat'
        - $ref: '#/components/parameters/BoundaryRectMaxLon'
        - $ref: '#/components/parameters/BoundaryRectMaxLat'
        - $ref: '#/components/parameters/BoundaryCircleLat'
        - $ref: '#/components/parameters/BoundaryCircleLon'
        - $ref: '#/components/parameters/BoundaryCircleRadius'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/ResponseMode'
        - $ref: '#/components/parameters/Dedupe'
      responses:
        '200':
          description: GeoJSON FeatureCollection of autocomplete results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/reverse:
    get:
      tags:
        - Geocoding
      summary: Reverse geocode a coordinate
      description: Finds indexed Pelias features near a longitude/latitude point.
      parameters:
        - name: point.lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 33.3152
        - name: point.lon
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 44.3661
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Layers'
        - $ref: '#/components/parameters/Sources'
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/FallbackLang'
        - $ref: '#/components/parameters/ResponseMode'
      responses:
        '200':
          description: GeoJSON FeatureCollection of nearby results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/place:
    get:
      tags:
        - Geocoding
      summary: Fetch one or more places by Pelias gid
      description: Returns stored features by Pelias global id.
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated Pelias GIDs.
          schema:
            type: string
          example: osm_postgis:venue:13189798864
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/ResponseMode'
      responses:
        '200':
          description: GeoJSON FeatureCollection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/batch/search:
    post:
      tags:
        - Batch
      summary: Batch forward geocode
      description: Runs multiple search queries in one request. Limited by `MAX_BATCH_SIZE`, default 100.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSearchRequest'
            example:
              queries:
                - text: Karrada Baghdad
                  size: 10
                  layers: venue,street,locality
                  sources: osm_postgis
                  boundary.country: IQ
                  focus.point.lat: 33.3152
                  focus.point.lon: 44.3661
                  lang: ar
      responses:
        '200':
          description: Batch results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/batch/reverse:
    post:
      tags:
        - Batch
      summary: Batch reverse geocode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchReverseRequest'
            example:
              queries:
                - point.lat: 33.3152
                  point.lon: 44.3661
                  size: 10
                  layers: address,street,venue
                  sources: osm_postgis
                  lang: ar
      responses:
        '200':
          description: Batch results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/search/structured:
    get:
      tags:
        - Geocoding
      summary: Structured geocoding
      parameters:
        - name: address
          in: query
          schema: { type: string }
        - name: street
          in: query
          schema: { type: string }
        - name: housenumber
          in: query
          schema: { type: string }
        - name: neighbourhood
          in: query
          schema: { type: string }
        - name: locality
          in: query
          schema: { type: string }
        - name: county
          in: query
          schema: { type: string }
        - name: region
          in: query
          schema: { type: string }
        - name: region_a
          in: query
          schema: { type: string }
        - name: postalcode
          in: query
          schema: { type: string }
        - name: country
          in: query
          schema: { type: string }
        - name: country_a
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Layers'
        - $ref: '#/components/parameters/Sources'
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/FallbackLang'
        - $ref: '#/components/parameters/FocusPointLat'
        - $ref: '#/components/parameters/FocusPointLon'
        - $ref: '#/components/parameters/ResponseMode'
        - $ref: '#/components/parameters/Dedupe'
      responses:
        '200':
          description: GeoJSON FeatureCollection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/nearby:
    get:
      tags:
        - Discovery
      summary: Nearby POI search
      description: Searches indexed features around a coordinate, ordered by distance.
      parameters:
        - name: point.lat
          in: query
          required: true
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: point.lon
          in: query
          required: true
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - name: radius
          in: query
          description: Radius in meters.
          schema: { type: number, minimum: 0.001, default: 1000 }
        - $ref: '#/components/parameters/Layers'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/BoundaryRectMinLon'
        - $ref: '#/components/parameters/BoundaryRectMinLat'
        - $ref: '#/components/parameters/BoundaryRectMaxLon'
        - $ref: '#/components/parameters/BoundaryRectMaxLat'
        - $ref: '#/components/parameters/BoundaryCircleLat'
        - $ref: '#/components/parameters/BoundaryCircleLon'
        - $ref: '#/components/parameters/BoundaryCircleRadius'
        - $ref: '#/components/parameters/ResponseMode'
        - $ref: '#/components/parameters/Dedupe'
        - name: sort
          in: query
          required: false
          description: Proximity/ranking sort mode.
          schema:
            type: string
            enum: [distance, relevance, hybrid]
            default: distance
        - name: category_mode
          in: query
          required: false
          description: Strategy for filtering multiple categories.
          schema:
            type: string
            enum: [any, all]
            default: any
        - name: include_distance
          in: query
          required: false
          description: Include distance_meters on each feature when Elasticsearch returns geo-distance sort values.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: GeoJSON FeatureCollection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/categories:
    get:
      tags:
        - Discovery
      summary: List searchable POI categories
      parameters:
        - name: lang
          in: query
          required: false
          description: Preferred category display language.
          schema:
            type: string
            enum: [ar, en, ku, ckb]
        - name: q
          in: query
          required: false
          description: Partial search over category ids, localized names, aliases, and OSM tags.
          schema:
            type: string
      responses:
        '200':
          description: Categories discovered from the index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
  /v1/debug/normalize:
    post:
      tags:
        - Debug
      summary: Normalize text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormalizeRequest'
            example:
              text: شارع الكرادة داخل
              lang: ar
      responses:
        '200':
          description: Normalized text and tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormalizeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/debug/explain:
    get:
      tags:
        - Debug
      summary: Explain generated Elasticsearch query
      security:
        - internalToken: []
        - bearerInternalToken: []
      parameters:
        - $ref: '#/components/parameters/Text'
        - name: point.lat
          in: query
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: point.lon
          in: query
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - $ref: '#/components/parameters/Layers'
        - $ref: '#/components/parameters/Sources'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Internal explain payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/index/stats:
    get:
      tags:
        - Discovery
      summary: Index statistics
      responses:
        '200':
          description: Index document counts and state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexStatsResponse'
  /health:
    get:
      tags:
        - Worker
      summary: Health
      description: Health endpoint. On port 4000 it checks the API; on port 9090 it checks the sync worker.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiHealthResponse'
                  - $ref: '#/components/schemas/WorkerHealth'
        '503':
          description: One or more dependencies are unavailable.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiHealthResponse'
                  - $ref: '#/components/schemas/WorkerHealth'
  /health/live:
    get:
      tags:
        - Worker
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
  /health/ready:
    get:
      tags:
        - Worker
      summary: Readiness probe
      description: Checks Elasticsearch, aliases, indexed documents, and worker readiness where applicable.
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiHealthReadyResponse'
                  - $ref: '#/components/schemas/WorkerHealthReadyResponse'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiHealthReadyResponse'
                  - $ref: '#/components/schemas/WorkerHealthReadyResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
  /health/dependencies:
    get:
      tags:
        - Worker
      summary: Dependency health
      responses:
        '200':
          description: Dependencies are healthy.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiHealthDependenciesResponse'
                  - $ref: '#/components/schemas/WorkerHealthDependenciesResponse'
        '503':
          description: Dependency unavailable.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiHealthDependenciesResponse'
                  - $ref: '#/components/schemas/WorkerHealthDependenciesResponse'
  /metrics:
    get:
      tags:
        - Worker
      summary: Prometheus metrics
      description: Prometheus text metrics for sync runs, Elasticsearch bulk writes, PostGIS query timings, and dependency health.
      servers:
        - url: http://localhost:9090
          description: PostGIS read-only sync worker
      responses:
        '200':
          description: Prometheus metrics payload.
          content:
            text/plain:
              schema:
                type: string
  /worker/sync/{source}:
    post:
      tags:
        - Worker
      summary: Start source sync
      description: Protected internal operation on worker port 9090.
      servers:
        - url: http://localhost:9090
          description: PostGIS read-only sync worker
      security:
        - internalToken: []
        - bearerInternalToken: []
      parameters:
        - $ref: '#/components/parameters/SourcePath'
      responses:
        '202':
          description: Run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /worker/reindex/{source}:
    post:
      tags:
        - Worker
      summary: Start source reindex
      servers:
        - url: http://localhost:9090
      security:
        - internalToken: []
        - bearerInternalToken: []
      parameters:
        - $ref: '#/components/parameters/SourcePath'
      responses:
        '202':
          description: Run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /worker/reindex-all:
    post:
      tags:
        - Worker
      summary: Start blue/green full reindex
      servers:
        - url: http://localhost:9090
      security:
        - internalToken: []
        - bearerInternalToken: []
      responses:
        '202':
          description: Run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /worker/runs:
    get:
      tags:
        - Worker
      summary: List worker runs
      servers:
        - url: http://localhost:9090
      security:
        - internalToken: []
        - bearerInternalToken: []
      responses:
        '200':
          description: Run history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkerRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /worker/runs/{run_id}:
    get:
      tags:
        - Worker
      summary: Get worker run
      servers:
        - url: http://localhost:9090
      security:
        - internalToken: []
        - bearerInternalToken: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerRun'
        '404':
          description: Run not found.
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: x-internal-token
    bearerInternalToken:
      type: http
      scheme: bearer
  parameters:
    Text:
      name: text
      in: query
      required: true
      description: Search text.
      schema:
        type: string
      example: restaurant
    Categories:
      name: categories
      in: query
      required: false
      description: Comma-separated categories to filter search results.
      schema:
        type: string
      example: restaurant,cafe
    ResponseMode:
      name: response_mode
      in: query
      required: false
      description: "Controls the verbosity of the response. `debug` requires `x-internal-token` or `Authorization: Bearer <token>` and returns 403 when the token is missing or invalid."
      schema:
        type: string
        enum: [standard, full, debug]
        default: standard
      example: standard
    Dedupe:
      name: dedupe
      in: query
      required: false
      description: Enable/disable proximity and name-based deduplication.
      schema:
        type: boolean
        default: true
      example: true
    Size:
      name: size
      in: query
      required: false
      description: Maximum number of results.
      schema:
        type: integer
        minimum: 1
        maximum: 40
        default: 10
      example: 10
    Layers:
      name: layers
      in: query
      required: false
      description: Comma-separated Pelias layers.
      schema:
        type: string
      example: venue,street,locality
    Sources:
      name: sources
      in: query
      required: false
      description: Comma-separated source names.
      schema:
        type: string
      example: osm_postgis
    BoundaryCountry:
      name: boundary.country
      in: query
      required: false
      description: ISO country filter if country metadata is available in the index.
      schema:
        type: string
      example: IQ
    FocusPointLat:
      name: focus.point.lat
      in: query
      required: false
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
      example: 33.3152
    FocusPointLon:
      name: focus.point.lon
      in: query
      required: false
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
      example: 44.3661
    Lang:
      name: lang
      in: query
      required: false
      description: Preferred response language.
      schema:
        type: string
      example: ar
    FallbackLang:
      name: fallback_lang
      in: query
      required: false
      description: Optional fallback language for name_fallback and label_fallback.
      schema:
        type: string
      example: en
    BoundaryRectMinLon:
      name: boundary.rect.min_lon
      in: query
      required: false
      schema: { type: number, minimum: -180, maximum: 180 }
    BoundaryRectMinLat:
      name: boundary.rect.min_lat
      in: query
      required: false
      schema: { type: number, minimum: -90, maximum: 90 }
    BoundaryRectMaxLon:
      name: boundary.rect.max_lon
      in: query
      required: false
      schema: { type: number, minimum: -180, maximum: 180 }
    BoundaryRectMaxLat:
      name: boundary.rect.max_lat
      in: query
      required: false
      schema: { type: number, minimum: -90, maximum: 90 }
    BoundaryCircleLat:
      name: boundary.circle.lat
      in: query
      required: false
      schema: { type: number, minimum: -90, maximum: 90 }
    BoundaryCircleLon:
      name: boundary.circle.lon
      in: query
      required: false
      schema: { type: number, minimum: -180, maximum: 180 }
    BoundaryCircleRadius:
      name: boundary.circle.radius
      in: query
      required: false
      description: Radius in meters.
      schema: { type: number, minimum: 0.001 }
    SourcePath:
      name: source
      in: path
      required: true
      schema:
        type: string
      example: osm_pois
  responses:
    BadRequest:
      description: Invalid or missing query parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid internal token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Internal token is required for debug response mode.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorObject:
      type: object
      required: [code, message, request_id, details]
      properties:
        code:
          type: string
          example: invalid_request
        message:
          type: string
          example: "Missing required parameter: text"
        request_id:
          type: string
          example: "018f645e-9d55-7f36-a9b2-6f704da13f6a"
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
    BatchSearchRequest:
      type: object
      required: [queries]
      properties:
        queries:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: true
    BatchReverseRequest:
      type: object
      required: [queries]
      properties:
        queries:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: true
    BatchResponse:
      type: object
      required: [results, summary]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchItem'
        summary:
          $ref: '#/components/schemas/BatchSummary'
    BatchItem:
      type: object
      required: [index, status, took_ms]
      properties:
        index:
          type: integer
        status:
          type: string
          enum: [ok, error]
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
        error:
          $ref: '#/components/schemas/ErrorObject'
        took_ms:
          type: integer
    BatchSummary:
      type: object
      required: [total, ok, error, took_ms]
      properties:
        total:
          type: integer
        ok:
          type: integer
        error:
          type: integer
        took_ms:
          type: integer
    CategoriesResponse:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    Category:
      type: object
      required: [id, name, names, aliases, parent, osm_tags, available_count]
      properties:
        id: { type: string }
        name: { type: string }
        names:
          $ref: '#/components/schemas/NamesObject'
        aliases:
          type: array
          items: { type: string }
        parent:
          type: string
          nullable: true
        osm_tags:
          type: object
          additionalProperties:
            type: string
        available_count:
          type: integer
    NormalizeRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }
        lang: { type: string }
    NormalizeResponse:
      type: object
      required: [input, normalized, tokens, detected_script, applied_rules, warnings]
      properties:
        input: { type: string }
        normalized: { type: string }
        tokens:
          type: array
          items: { type: string }
        detected_script:
          type: string
          enum: [arabic, latin, mixed, unknown]
        applied_rules:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
    ExplainResponse:
      type: object
      properties:
        generated_query:
          type: object
          additionalProperties: true
        elastic_took_ms:
          type: integer
        matched_layers:
          type: object
          additionalProperties: { type: integer }
        top_results:
          type: array
          items:
            type: object
            additionalProperties: true
        normalization:
          $ref: '#/components/schemas/NormalizeResponse'
    IndexStatsResponse:
      type: object
      required: [documents, sources, total_documents, index_name, alias, last_indexed_at, health]
      properties:
        documents:
          type: object
          additionalProperties: { type: integer }
        sources:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SourceFreshness'
        total_documents: { type: integer }
        index_name: { type: string, nullable: true }
        alias: { type: string }
        last_indexed_at: { type: string, format: date-time, nullable: true }
        health:
          $ref: '#/components/schemas/IndexHealth'
    SourceFreshness:
      type: object
      required:
        - documents
        - last_success_at
        - last_started_at
        - last_finished_at
        - staleness_seconds
        - last_indexed_count
        - last_deleted_count
        - last_failed_count
      properties:
        documents: { type: integer }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_started_at: { type: string, format: date-time, nullable: true }
        last_finished_at: { type: string, format: date-time, nullable: true }
        staleness_seconds: { type: integer, nullable: true }
        last_indexed_count: { type: integer }
        last_deleted_count: { type: integer }
        last_failed_count: { type: integer }
    IndexHealth:
      type: object
      required: [elasticsearch, alias_exists, has_documents, worker_stale]
      properties:
        elasticsearch: { type: boolean }
        alias_exists: { type: boolean }
        has_documents: { type: boolean }
        worker_stale: { type: boolean }
    WorkerRun:
      type: object
      required:
        - run_id
        - source
        - mode
        - started_at
        - finished_at
        - status
        - indexed_count
        - deleted_count
        - failed_count
        - error
      properties:
        run_id: { type: string }
        source: { type: string }
        mode:
          type: string
          enum: [sync, reindex]
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [running, success, failed]
        indexed_count: { type: integer }
        deleted_count: { type: integer }
        failed_count: { type: integer }
        error: { type: string, nullable: true }
    NamesObject:
      type: object
      additionalProperties:
        type: string
      example:
        default: Hospitality Restaurant
        ar: مطعم الضيافة
        en: Hospitality Restaurant
    AddressParts:
      type: object
      properties:
        street: { type: string }
        number: { type: string }
        housenumber: { type: string }
        zip: { type: string }
        postalcode: { type: string }
        unit: { type: string }
      additionalProperties: true
    RoutablePoint:
      type: object
      required: [lon, lat, type, source]
      properties:
        lon: { type: number, minimum: -180, maximum: 180 }
        lat: { type: number, minimum: -90, maximum: 90 }
        type: { type: string }
        source: { type: string }
    Entrance:
      type: object
      required: [lon, lat, type]
      properties:
        lon: { type: number, minimum: -180, maximum: 180 }
        lat: { type: number, minimum: -90, maximum: 90 }
        type: { type: string }
    FeatureCollection:
      type: object
      required:
        - type
        - features
      properties:
        geocoding:
          type: object
          additionalProperties: true
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
    Feature:
      type: object
      required:
        - type
        - geometry
        - properties
      properties:
        type:
          type: string
          enum: [Feature]
        geometry:
          $ref: '#/components/schemas/PointGeometry'
        properties:
          $ref: '#/components/schemas/PlaceProperties'
    PointGeometry:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
          example: [44.3661, 33.3152]
    PlaceProperties:
      type: object
      required: [id, gid, layer, source, source_id, name, label]
      properties:
        id:
          type: string
        gid:
          type: string
          example: osm_postgis:venue:13189798864
        layer:
          type: string
          example: venue
        source:
          type: string
          example: osm_postgis
        source_id:
          type: string
        name:
          type: string
        name_preferred:
          type: string
        name_fallback:
          type: string
        label:
          type: string
        label_preferred:
          type: string
        label_fallback:
          type: string
        lang:
          type: string
        fallback_lang:
          type: string
        confidence:
          type: number
        match_type:
          type: string
        accuracy:
          type: string
        addendum:
          type: object
          additionalProperties: true
        category:
          type: string
        categories:
          type: array
          items:
            type: string
        category_ids:
          type: array
          items:
            type: string
        address_parts:
          $ref: '#/components/schemas/AddressParts'
        country:
          type: string
        country_a:
          type: string
        region:
          type: string
        region_a:
          type: string
        county:
          type: string
        locality:
          type: string
        localadmin:
          type: string
        neighbourhood:
          type: string
        street:
          type: string
        housenumber:
          type: string
        postalcode:
          type: string
        center:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
        routable_point:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
        distance_meters:
          type: number
        bearing:
          type: number
        distance_score:
          type: number
        popularity_score:
          type: number
        final_score:
          type: number
        # POI Fields (returned in full and debug modes)
        phone:
          type: string
        website:
          type: string
        opening_hours:
          type: string
        brand:
          type: string
        operator:
          type: string
        cuisine:
          type: string
        wheelchair:
          type: string
        delivery:
          type: string
        takeaway:
          type: string
        # Routing arrays (returned in full and debug modes)
        routable_points:
          type: array
          items:
            $ref: '#/components/schemas/RoutablePoint'
        entrances:
          type: array
          items:
            $ref: '#/components/schemas/Entrance'
        # Names object (returned in full and debug modes)
        names:
          $ref: '#/components/schemas/NamesObject'
        # Debug Fields (returned in debug mode only)
        relevance_score:
          type: number
        source_tags:
          type: object
          additionalProperties: true
        rank_debug:
          type: object
          additionalProperties: true
      additionalProperties: true
    WorkerHealth:
      type: object
      required:
        - status
        - checks
        - sources
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          properties:
            postgis:
              type: boolean
            elasticsearch:
              type: boolean
            aliases:
              type: boolean
        sources:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SourceState'
    SourceState:
      type: object
      properties:
        last_success_timestamp:
          type: string
          format: date-time
          nullable: true
        last_started_timestamp:
          type: string
          format: date-time
          nullable: true
        last_duration_seconds:
          type: number
          nullable: true
        last_indexed_count:
          type: integer
        last_failed_count:
          type: integer
        last_deleted_count:
          type: integer
        failure_count:
          type: integer
        last_error:
          type: object
          nullable: true
          additionalProperties: true
        seen_id_count:
          type: integer
    ApiHealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          enum: [geocoder-api]
    ApiHealthReadyResponse:
      type: object
      required:
        - status
        - checks
        - documents
        - alias
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          properties:
            elasticsearch:
              type: boolean
            alias_exists:
              type: boolean
            index_has_documents:
              type: boolean
            worker_stale:
              type: boolean
        documents:
          type: integer
        alias:
          type: string
        index_name:
          type: string
          nullable: true
    WorkerHealthReadyResponse:
      type: object
      required:
        - status
        - checks
        - documents
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          properties:
            postgis:
              type: boolean
            elasticsearch:
              type: boolean
            aliases:
              type: boolean
            index_has_documents:
              type: boolean
            worker_stale:
              type: boolean
        documents:
          type: integer
    ApiHealthDependenciesResponse:
      type: object
      required:
        - status
        - dependencies
      properties:
        status:
          type: string
          enum: [ok, degraded]
        dependencies:
          type: object
          properties:
            elasticsearch:
              type: object
              properties:
                ok: { type: boolean }
                alias: { type: string }
                targets: { type: array, items: { type: string } }
                error: { type: string }
            pelias_api:
              type: object
              properties:
                ok: { type: boolean }
                url: { type: string }
    WorkerHealthDependenciesResponse:
      type: object
      required:
        - status
        - dependencies
      properties:
        status:
          type: string
          enum: [ok, degraded]
        dependencies:
          type: object
          properties:
            postgis: { type: boolean }
            elasticsearch: { type: boolean }
            aliases: { type: boolean }
